name: release

# Tags only. Nothing here runs on a branch or a pull request: push to main and
# open a PR to exercise `.github/workflows/test.yml` first, then tag the commit
# you want to ship. The `test` gate below re-runs that same suite on the tag
# itself, so a release can never be built from untested code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Single source of truth for the version, read from Cargo.toml.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: read
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "nano $v"

  # The gate: the identical suite CI runs, on the tagged commit.
  test:
    needs: version
    uses: ./.github/workflows/test.yml

  build:
    needs: [version, test]
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar, toolchain: musl-tools }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, archive: tar, toolchain: gcc-aarch64-linux-gnu, qemu: true }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar }
          # macos-13 is retired; it no longer resolves and the job sits queued
          # forever. The plain `macos-15`/`macos-latest` labels are arm64 now, so
          # the Intel runner has to be asked for by name. Same macOS 26 SDK as
          # the aarch64 job above, so both macOS artifacts come from one toolchain.
          - { target: x86_64-apple-darwin, os: macos-26-intel, archive: tar }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install linker
        if: matrix.toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain }}
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: install emulator for cross targets
        if: matrix.qemu
        shell: bash
        run: |
          # qemu-user-static ships the interpreter we invoke directly below.
          # Registering binfmt instead would need binfmt-support, which is not
          # installed on the runner image, and is not needed to run one binary.
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          command -v qemu-aarch64-static

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: smoke test the artifact
        if: ${{ !matrix.qemu }}
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          if [ "$t" = "x86_64-pc-windows-msvc" ]; then
            bin="target/$t/release/nano.exe"
          else
            bin="target/$t/release/nano"
            chmod +x "$bin"
          fi
          # the version must match the manifest, or the artifact is mislabelled
          got=$("$bin" --version)
          echo "built: $got"
          test "$got" = "nano ${{ needs.version.outputs.version }}"

      - name: smoke test the cross-compiled artifact
        if: ${{ matrix.qemu }}
        shell: bash
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          want="nano ${{ needs.version.outputs.version }}"
          bin="target/$t/release/nano"
          chmod +x "$bin"
          test -s "$bin"

          # Structural check: the cross compiler produced an artifact for the
          # target, not for the runner it happened to be built on.
          desc=$(file -b "$bin")
          echo "  $desc"
          case "$t" in
            aarch64-unknown-linux-gnu)
              echo "$desc" | grep -q 'ARM aarch64' \
                || { echo "::error::$bin is not an aarch64 binary: $desc"; exit 1; }
              ;;
          esac

          # The version is folded into the instruction stream as immediates, so
          # it is not greppable in the binary. Executing it is the only honest
          # way to read it back, exactly as for a native target. qemu's user
          # mode needs the cross glibc as its sysroot, hence -L.
          got=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu "$bin" --version)
          echo "ran under qemu: $got"
          test "$got" = "$want"
          echo "built: $got"

      - name: stage
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          t="${{ matrix.target }}"
          stage="stage/nano-$v-$t"
          mkdir -p "$stage"
          if [ "$t" = "x86_64-pc-windows-msvc" ]; then
            cp "target/$t/release/nano.exe" "$stage/nano.exe"
          else
            cp "target/$t/release/nano" "$stage/nano"
          fi
          cp README.md "$stage/"
          [ -d docs ] && cp -r docs "$stage/" || true
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          chmod +x "$stage/nano" 2>/dev/null || true

      - name: package (tar)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          t="${{ matrix.target }}"
          out="nano-$v-$t.tar.gz"
          mkdir -p dist
          tar czf "dist/$out" -C stage "nano-$v-$t"
          ( cd dist && sha256sum "$out" > "$out.sha256" )

      - name: package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $t = '${{ matrix.target }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "stage/nano-$v-$t" -DestinationPath "dist/nano-$v-$t.zip"
          $h = (Get-FileHash "dist/nano-$v-$t.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  nano-$v-$t.zip" | Out-File -Encoding ascii "dist/nano-$v-$t.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nano-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nano-*
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS
          for f in *.sha256; do cat "$f" >> SHA256SUMS; echo >> SHA256SUMS; done
          rm -f ./*.sha256
          cat SHA256SUMS

      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "nano $VERSION" --generate-notes
          fi
